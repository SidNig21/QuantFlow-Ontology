name: ci
on:
  push:
    branches: [QuantFlow, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Release verification (install + unit + production build + QA)
        run: bun qa/verify-release.ts
