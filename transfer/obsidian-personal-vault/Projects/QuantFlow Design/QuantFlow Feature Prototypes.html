<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #06070d; overflow: hidden; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes qfblink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
  @keyframes qfflow { to { stroke-dashoffset: -32; } }
  @keyframes qfslidein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes qfslideup { from { opacity: 0; } to { opacity: 1; } }
</style>
