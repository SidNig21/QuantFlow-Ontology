<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>QuantFlow — Dark Redesign</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07090c; color: #e7ecf2;
    font-family: 'Geist', system-ui, sans-serif; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes cableFlow { to { stroke-dashoffset: -32; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="artboards/_shared.jsx"></script>
<script type="text/babel" src="artboards/01_faithful.jsx"></script>
<script type="text/babel" src="artboards/02_cable.jsx"></script>
<script type="text/babel" src="artboards/03_glass.jsx"></script>
<script type="text/babel" src="artboards/04_cable_lab.jsx"></script>

<script type="text/babel" data-presets="react">
const App = () => (
  <DesignCanvas title="QuantFlow — Dark Redesign" subtitle="Three directions, terminal-green accent">
    <DCSection id="cables" title="Cable system · interactive prototype">
      <DCArtboard id="cable-lab" label="Cable Lab — drag from a port to connect, shift-click cable to delete, parallel cables bundle" width={1280} height={800}>
        <div style={{ width: 1280, height: 800, background: '#06080c', borderRadius: 10, overflow: 'hidden', border: '1px solid #1c232d', position: 'relative' }}>
          <CableLab />
        </div>
      </DCArtboard>
    </DCSection>
    <DCSection id="redesign" title="Window redesign · 1280×800">
      <DCArtboard id="faithful" label="01 · Faithful Dark — port your current layout to the new tokens" width={1280} height={800}>
        <FaithfulDark />
      </DCArtboard>
      <DCArtboard id="cable" label="02 · Cable Foundation — denser, status spines, connection cables, command palette" width={1280} height={800}>
        <CableFoundation />
      </DCArtboard>
      <DCArtboard id="glass" label="03 · Glass Canvas — atmospheric, floating glass panels, slim chrome" width={1280} height={800}>
        <GlassCanvas />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
