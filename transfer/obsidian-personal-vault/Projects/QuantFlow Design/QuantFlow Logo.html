<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantFlow — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0a0d12; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #board { width: 1600px; height: 1000px; transform-origin: center center; }
  svg { overflow: visible; }
</style>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a0d12"/>
    <g transform="translate(50 46)" fill="none" stroke="#e7ecf2" stroke-width="1" opacity="0.7">
      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" stroke-dasharray="3 3"/>
      <line x1="0" y1="0" x2="0" y2="-24"/><line x1="0" y1="0" x2="21" y2="12"/><line x1="0" y1="0" x2="-21" y2="12"/>
    </g>
    <circle cx="71" cy="34" r="3.4" fill="#b7ff00"/><circle cx="50" cy="46" r="3.4" fill="#2fe6cf"/><circle cx="50" cy="70" r="3.4" fill="#c79bff"/>
  </svg>
</template>
</head>
<body>
<div id="stage"><div id="board"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="logo/cube3d.js"></script>
<script type="text/babel" src="logo/logokit.jsx"></script>
<script type="text/babel" src="logo/flow-variants.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('board')).render(<FlowV4 />);
  // fit the 1600×1000 board to the viewport (contain), letterboxed on black
  function fit() {
    const s = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    document.getElementById('board').style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
