<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Artboard 17 export · armed</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0d12; overflow: hidden; width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; }
  body { width: 100vw; height: 100vh; }
  #stage { width: 1500px; height: 1100px; transform-origin: center center; flex-shrink: 0; }
  #root  { width: 100%; height: 100%; }
  /* Hide prototype-only "↺ Reset prototype" chip — see clarifications.md §5 */
  button[style*="bottom: 14px"][style*="right: 14px"] { display: none !important; }
  </style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.__autoFit = () => {
        const stage = document.getElementById('stage');
        const sw = stage.offsetWidth, sh = stage.offsetHeight;
        const ww = window.innerWidth, wh = window.innerHeight;
        const scale = Math.min(ww/sw, wh/sh);
        stage.style.transform = 'scale(' + scale + ')';
        window.__fitScale = scale;
      };
      addEventListener('load', () => { window.__autoFit(); setTimeout(window.__autoFit, 200); });
      addEventListener('resize', () => window.__autoFit());
      </script>
</head>
<body>
<div id="stage"><div id="root"></div></div>
<script type="text/babel" src="_src/16_app_faithful.jsx"></script>
<script type="text/babel" src="_src/17_legend_v1.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<LegendV1 />);
  // Auto-arm RL Training so the export shows the canonical armed state
  setTimeout(() => {
    const tplBtn = [...document.querySelectorAll('button')].find(
      b => (b.textContent || '').includes('RL Training')
    );
    tplBtn && tplBtn.click();
    setTimeout(() => { window.__exportReady = true; }, 600);
  }, 800);
</script>
</body></html>
