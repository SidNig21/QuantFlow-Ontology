<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuantFlow — Quiet Tiles</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=IBM+Plex+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #07090c; color: #e7ecf2; font-family: 'Geist', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes qfSpin       { to { transform: rotate(360deg); } }
  @keyframes qfBlink      { 50% { opacity: 0; } }
  @keyframes qfCableFlow      { to { stroke-dashoffset: -32; } }
  @keyframes qfCableFlowDense { to { stroke-dashoffset: -28; } }
  @keyframes qfPulseRing  { 0% { transform: scale(0.55); opacity: 0.7; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes qfBreath     { 0%, 100% { transform: scale(0.78); opacity: 0.4; } 50% { transform: scale(1.22); opacity: 1; } }
  @keyframes qfScan       { 0% { transform: translateX(-120%); } 100% { transform: translateX(420%); } }
  @keyframes qfEkgDraw    { 0% { stroke-dashoffset: 560; } 100% { stroke-dashoffset: 0; } }
  @keyframes qfMarquee    { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes qfEq         { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @keyframes qfSealSpin   { to { transform: rotate(360deg); } }
  @keyframes qfFill       { 0% { transform: scaleX(0); } 45% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  @keyframes qfDots       { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes qfEdge       { 0% { transform: translateX(-80px); } 100% { transform: translateX(480px); } }
  @keyframes qfSkel       { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="120" fill="#0a0d12"/>
    <rect x="34" y="38" width="52" height="44" rx="6" fill="none" stroke="#3a4252" stroke-width="2"/>
    <rect x="40" y="36" width="20" height="2.5" rx="1.2" fill="#B7FF00"/>
    <circle cx="60" cy="60" r="5" fill="#B7FF00"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="v2/qf2-tokens.jsx"></script>
<script type="text/babel" src="v2/qf2-parts.jsx"></script>
<script type="text/babel" src="tiles/tt-shared.jsx"></script>
<script type="text/babel" src="tiles/tt-loaders.jsx"></script>
<script type="text/babel" src="tiles/tt-ansi.jsx"></script>
<script type="text/babel" src="tiles/tt-quiet-family.jsx"></script>
<script type="text/babel" src="tiles/tt-quiet-stages.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#B7FF00",
  "watermark": true,
  "motion": true
}/*EDITMODE-END*/;

const ACCENTS = [
  { v: '#B7FF00', label: 'Live green' },
  { v: 'oklch(0.72 0.13 210)', label: 'Cyan' },
  { v: 'oklch(0.70 0.14 240)', label: 'Blue' },
  { v: 'oklch(0.80 0.14 80)', label: 'Amber' },
];

const Board = ({ w, h, children }) => {
  const ref = React.useRef(null);
  const [scale, setScale] = React.useState(1);
  React.useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const fit = () => setScale(Math.min(1, el.clientWidth / w));
    fit(); const ro = new ResizeObserver(fit); ro.observe(el); return () => ro.disconnect();
  }, [w]);
  return (
    <div ref={ref} style={{ width: '100%' }}>
      <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: 'top left',
        marginBottom: (scale - 1) * h }}>{children}</div>
    </div>
  );
};

const Group = ({ kicker, title, blurb, children }) => (
  <section style={{ maxWidth: 1440, margin: '0 auto', padding: '0 28px' }}>
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, flexWrap: 'wrap', marginBottom: 4 }}>
      <span style={{ fontFamily: QF2.fontMono, fontSize: 11, color: QF2.flow, letterSpacing: '0.18em', textTransform: 'uppercase' }}>{kicker}</span>
      <h2 style={{ margin: 0, fontFamily: QF2.fontDisplay, fontSize: 26, fontWeight: 600, color: QF2.fg, letterSpacing: '-0.015em' }}>{title}</h2>
    </div>
    <p style={{ margin: '0 0 18px', fontSize: 13.5, color: QF2.muted, lineHeight: 1.55, maxWidth: 780 }}>{blurb}</p>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>{children}</div>
  </section>
);

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const cfg = { accent: t.accent, watermark: t.watermark !== false, motion: t.motion !== false };

  return (
    <React.Fragment>
      <div style={{ minHeight: '100vh', paddingBottom: 90 }}>
        <header style={{ maxWidth: 1440, margin: '0 auto', padding: '46px 28px 30px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
            <QFMark size={52} glow />
            <div>
              <div style={{ fontFamily: QF2.fontDisplay, fontSize: 30, fontWeight: 600, letterSpacing: '-0.02em' }}>Quiet tiles</div>
              <div style={{ fontFamily: QF2.fontMono, fontSize: 12, color: QF2.muted, letterSpacing: '0.04em', marginTop: 4 }}>
                three takes on the tile you liked · same calm DNA · same Breath loader
              </div>
            </div>
          </div>
        </header>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 56 }}>
          <Group kicker="Compare" title="Three quiets, side by side"
            blurb="The same gate-verdict scenario rendered in all three. They share what you liked about Quiet — no busy header, content-first, breathing room — but each is its own object. Pick a favorite, or mix.">
            <Board w={1380} h={560}><StageQuietCompare cfg={cfg} /></Board>
          </Group>

          <Group kicker="A · the simple one, detailed" title="Refined"
            blurb="Your Quiet tile, made better. The hairline becomes a short accent tab; a glyph chip and a faint divider give the header just enough structure; a footer carries the quiet meta. It stays simple — it just feels finished.">
            <Board w={1380} h={760}><StageQuietA cfg={cfg} /></Board>
          </Group>

          <Group kicker="B · unique" title="Air"
            blurb="Minimalism pushed further. There's almost no frame — the tile is drawn by a soft glow and shadow, a floating name, a hero verdict word, a single short underline. It reads as weightless, gallery-like.">
            <Board w={1380} h={760}><StageQuietB cfg={cfg} /></Board>
          </Group>

          <Group kicker="C · unique" title="Letterhead"
            blurb="Quiet set like fine stationery. A crisp hairline border, a mono eyebrow naming the role, the name in display type, a set rule, and a signature line. Typographic and formal — exactly right for a signed verdict.">
            <Board w={1380} h={760}><StageQuietC cfg={cfg} /></Board>
          </Group>
        </div>

        <footer style={{ maxWidth: 1440, margin: '64px auto 0', padding: '0 28px', fontFamily: QF2.fontMono, fontSize: 11, color: QF2.muted2, letterSpacing: '0.04em' }}>
          Each board is the tile on the real canvas — grid · wires · watermark. Loading tiles keep the Breath loader. Tweak accent · watermark · motion at right.
        </footer>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Accent hue" />
        <TweakColor label="Accent" value={t.accent} options={ACCENTS.map(a => a.v)} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Canvas" />
        <TweakToggle label="Watermark" value={cfg.watermark} onChange={(v) => setTweak('watermark', v)} />
        <TweakToggle label="Motion" value={cfg.motion} onChange={(v) => setTweak('motion', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
