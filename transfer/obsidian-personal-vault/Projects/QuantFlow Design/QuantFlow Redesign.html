<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>QuantFlow — Dark Redesign</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07090c; color: #e7ecf2;
    font-family: 'Geist', system-ui, sans-serif; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes cableFlow { to { stroke-dashoffset: -32; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Special+Elite&display=swap" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="artboards/_shared.jsx"></script>
<script type="text/babel" src="artboards/01_faithful.jsx"></script>
<script type="text/babel" src="artboards/02_cable.jsx"></script>
<script type="text/babel" src="artboards/03_glass.jsx"></script>
<script type="text/babel" src="artboards/04_cable_lab.jsx"></script>
<script type="text/babel" src="artboards/05_sidebar.jsx"></script>
<script type="text/babel" src="artboards/06_watchtower.jsx"></script>
<script type="text/babel" src="artboards/07_full_shell.jsx"></script>
<script type="text/babel" src="artboards/08_console.jsx"></script>
<script type="text/babel" src="artboards/09_studio.jsx"></script>
<script type="text/babel" src="artboards/10_endless.jsx"></script>
<script type="text/babel" src="artboards/11_yutori.jsx"></script>
<script type="text/babel" src="artboards/12_mercury.jsx"></script>
<script type="text/babel" src="artboards/13_iris.jsx"></script>
<script type="text/babel" src="artboards/14_atelier.jsx"></script>
<script type="text/babel" src="artboards/15_atrium.jsx"></script>
<script type="text/babel" src="artboards/16_app_faithful.jsx"></script>
<script type="text/babel" src="artboards/17_legend_v1.jsx"></script>
<script type="text/babel" src="artboards/18_legend_v1_states.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "cyan",
  "sidebarCollapsed": false
}/*EDITMODE-END*/;

const accentLabel = { green: 'Green · default', amber: 'Amber', cyan: 'Cyan', blue: 'Blue' };
const ACCENT_SWATCHES = [
  { key: 'green', hex: 'oklch(0.78 0.16 145)' },
  { key: 'amber', hex: 'oklch(0.78 0.14 80)'  },
  { key: 'cyan',  hex: 'oklch(0.78 0.13 200)' },
  { key: 'blue',  hex: 'oklch(0.72 0.14 250)' },
];

const AccentSwatchRow = ({ value, onChange }) => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 14px' }}>
    <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.85)' }}>Accent · {accentLabel[value] || value}</span>
    <div style={{ display: 'flex', gap: 6 }}>
      {ACCENT_SWATCHES.map(s => {
        const active = s.key === value;
        return (
          <button key={s.key} onClick={() => onChange(s.key)}
            title={s.key}
            style={{
              all: 'unset', cursor: 'pointer',
              width: 22, height: 22, borderRadius: 5,
              background: s.hex,
              outline: active ? '2px solid rgba(255,255,255,0.85)' : '2px solid transparent',
              outlineOffset: 1,
              boxShadow: active ? `0 0 10px ${s.hex}` : 'none',
              transition: 'box-shadow 0.15s ease',
            }}
          />
        );
      })}
    </div>
  </div>
);

// Wrap FullShell so it picks up tweak values via context (rather than the
// global broadcast it also supports). Both artboards mount independently
// so changes apply consistently.
const FullShellWithTweaks = ({ tweaks }) => {
  React.useEffect(() => {
    // Broadcast to the live FullShell mount
    window.postMessage({ type: '__fs_tweak', accent: tweaks.accent, sidebarCollapsed: tweaks.sidebarCollapsed }, '*');
  }, [tweaks.accent, tweaks.sidebarCollapsed]);
  // Set defaults so the artboard renders correctly even before the message arrives
  window.__FullShellDefaults = { accent: tweaks.accent, sidebarCollapsed: tweaks.sidebarCollapsed };
  return <FullShell key={`${tweaks.accent}|${tweaks.sidebarCollapsed}`} />;
};

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <React.Fragment>
      <DesignCanvas title="QuantFlow — Visual workspace explorations" subtitle="The product: endless canvas + terminals + strings. Trading is one application.">

        <DCSection id="legend-v1" title="Slice 1 · Legend v1 — spawn dock" subtitle="Compact dock on the canvas's left edge, grouped Agents / Workers / Shell + Templates + Commence. Interactive prototype (17) and states reference (18). Spawn icons map 1:1 to roles from role-service.ts.">
          <DCArtboard id="legend-v1" label="17 · Legend v1 — interactive (click recipes, arm template, fire Commence; toggle density + spawn mode in dock footer)" width={1500} height={1100}>
            <LegendV1 />
          </DCArtboard>
          <DCArtboard id="legend-v1-states" label="18 · Legend v1 — states reference (compact + comfortable × idle + armed, plus state matrix)" width={1500} height={1080}>
            <LegendV1States />
          </DCArtboard>
        </DCSection>
        <DCSection id="app-faithful" title="Faithful recreation — current Windows build" subtitle="16 · App Faithful — pixel-faithful rebuild of the live shell (titlebar + Files/Tiles tabs + tile registry + canvas with two connected terminals + status bar), modeled on real shell.css tokens and the v0.8.0 screenshot.">
          <DCArtboard id="app-faithful" label="16 · App Faithful — current QuantFlow shell (Cursor Collab workspace, 2 terminal tiles, green flowing cable)" width={1500} height={1100}>
            <AppFaithful />
          </DCArtboard>
        </DCSection>

        <DCSection id="languages" title="Round five — different design languages" subtitle="14 · Atelier — newspaper broadsheet. 15 · Atrium — architectural blueprint. Same spec, completely different vocabularies.">
          <DCArtboard id="atelier" label="14 · Atelier — newspaper broadsheet: masthead, columns as articles, wire dispatches, classifieds, ink-line cross-references" width={1700} height={1080}>
            <Atelier />
          </DCArtboard>
          <DCArtboard id="atrium" label="15 · Atrium — architectural blueprint: rooms as tiles, conduits as strings, title block, schedule, dim. lines, north + scale" width={1700} height={1080}>
            <Atrium />
          </DCArtboard>
        </DCSection>

        <DCSection id="refined" title="Round four — linked back to the original DNA" subtitle="12 · Mercury (my take) — slate + mercury + sodium amber. 13 · Iris · Jaded · Sonder — iridescent jade with ghost layers.">
          <DCArtboard id="mercury" label="12 · Mercury — slate-blue + mercury silver + sodium amber, serif/sans pairing, now-playing strip, vitals rail, ticker" width={1600} height={1040}>
            <Mercury />
          </DCArtboard>
          <DCArtboard id="iris" label="13 · Iris · Jaded · Sonder — deep jade, iridescent strings, focal aperture, sonder ghost layers, memory carousel" width={1720} height={940}>
            <Iris />
          </DCArtboard>
        </DCSection>

        <DCSection id="canvas-first" title="Round three — canvas-first" subtitle="10 · Endless (my take) — lean into the infinite canvas. 11 · Yutori — paper, sumi-ink, breathing room.">
          <DCArtboard id="endless" label="10 · Endless — infinite canvas + heterogeneous tiles + particle strings + minimap + pan/zoom HUD" width={1800} height={1080}>
            <Endless />
          </DCArtboard>
          <DCArtboard id="yutori" label="11 · Yutori — paper, sumi-ink, refined serif, brush-stroke strings, breathing room" width={1700} height={880}>
            <Yutori />
          </DCArtboard>
        </DCSection>

        <DCSection id="visions" title="Round two — trading-themed" subtitle="08 · Console (brutalist) + 09 · Studio (premium product)">
          <DCArtboard id="console" label="08 · Console — brutalist instrument panel, PCB traces, blaze-orange on ink" width={1600} height={1040}>
            <Console />
          </DCArtboard>
          <DCArtboard id="studio" label="09 · Studio — marketed product UI, editorial wordmark, hero metrics, BTC chart + activity feed" width={1600} height={1040}>
            <Studio />
          </DCArtboard>
        </DCSection>

        <DCSection id="shell" title="Original · Full shell" subtitle="For reference — the dark cable canvas we had before">
          <DCArtboard id="full-shell" label="07 · Full Shell — sidebar + canvas (Trading · Training · Monitoring chains) + Watchtower" width={1600} height={1040}>
            <FullShellWithTweaks tweaks={t} />
          </DCArtboard>
        </DCSection>

        <DCSection id="cables" title="Cable system · interactive prototype">
          <DCArtboard id="cable-lab" label="04 · Cable Lab — drag from a port to connect, shift-click cable to delete, parallel cables bundle" width={1280} height={800}>
            <div style={{ width: 1280, height: 800, background: '#06080c', borderRadius: 10, overflow: 'hidden', border: '1px solid #1c232d', position: 'relative' }}>
              <CableLab />
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="redesign" title="Window redesign · 1280×800">
          <DCArtboard id="faithful" label="01 · Faithful Dark — port your current layout to the new tokens" width={1280} height={800}>
            <FaithfulDark />
          </DCArtboard>
          <DCArtboard id="cable" label="02 · Cable Foundation — denser, status spines, connection cables, command palette" width={1280} height={800}>
            <CableFoundation />
          </DCArtboard>
          <DCArtboard id="glass" label="03 · Glass Canvas — atmospheric, floating glass panels, slim chrome" width={1280} height={800}>
            <GlassCanvas />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Full Shell" />
        <AccentSwatchRow value={t.accent} onChange={(v) => setTweak('accent', v)} />
        <TweakToggle
          label="Sidebar collapsed"
          value={t.sidebarCollapsed}
          onChange={(v) => setTweak('sidebarCollapsed', v)}
        />
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
